[project]
name = "ibd-biom-glycoda"
version = "0.1.0"
description = "Analysis of IgG N-glycomics for IBD biomarker discovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adjusttext>=1.3.0",
    "glycowork>=1.6.4",
    "ipykernel>=7.1.0",
    "pip>=25.3",
    "pytest>=9.1.1",
    "threadpoolctl>=3.6.0",
    "xgboost>=3.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
